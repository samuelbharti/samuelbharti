<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>profile viz preview</title>
<style>
  body { margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace; background: #ffffff; color: #1f2328; transition: background 0.2s; }
  body[data-theme="dark"] { background: #0d1117; color: #e6edf3; }
  header { position: sticky; top: 0; display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: inherit; border-bottom: 1px solid #d1d9e0; }
  body[data-theme="dark"] header { border-color: #30363d; }
  button { font: inherit; padding: 6px 14px; cursor: pointer; border-radius: 6px; border: 1px solid #d1d9e0; background: transparent; color: inherit; }
  main { max-width: 896px; margin: 0 auto; padding: 24px 16px 80px; }
  section { margin-bottom: 48px; }
  h2 { font-size: 14px; font-weight: 600; }
  img { width: 100%; display: block; border: 1px dashed #d1d9e044; }
</style>
</head>
<body>
<header>
  <strong>profile viz preview</strong>
  <button id="toggle">toggle dark</button>
  <span style="opacity:.6;font-size:12px">rendered inside a fake GitHub README column (896px)</span>
</header>
<main>
  <section>
    <h2>1 · genome browser</h2>
    <img class="viz" data-name="genome" src="../../assets/viz/genome-light.svg" alt="genome browser concept">
  </section>
  <section>
    <h2>2 · circos</h2>
    <img class="viz" data-name="circos" src="../../assets/viz/circos-light.svg" alt="circos concept">
  </section>
  <section>
    <h2>3 · volcano / manhattan</h2>
    <img class="viz" data-name="volcano" src="../../assets/viz/volcano-light.svg" alt="volcano manhattan concept">
  </section>
</main>
<script>
  const btn = document.getElementById("toggle");
  btn.addEventListener("click", () => {
    const dark = document.body.dataset.theme !== "dark";
    document.body.dataset.theme = dark ? "dark" : "";
    document.querySelectorAll(".viz").forEach((img) => {
      img.src = `../../assets/viz/${img.dataset.name}-${dark ? "dark" : "light"}.svg?${Date.now()}`;
    });
  });
</script>
</body>
</html>
